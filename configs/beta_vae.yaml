extends: base.yaml

mlflow:
  experiment_name: beta-vae

model:
  type: beta_vae
  latent_dim: 16
  input_length: 256
  beta: 4.0   # KL weight (beta=1 recovers the vanilla ELBO); sweep this
              # for your ablation study
  # base_channels: 16   # optional -- defaults set in beta_vae.py
  # n_conv_layers: 4    # optional -- defaults set in beta_vae.py
