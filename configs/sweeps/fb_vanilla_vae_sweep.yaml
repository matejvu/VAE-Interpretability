# Sweep-spec, read by scripts/sweep.py -- NOT the same schema as
# configs/*.yaml (train.py won't load this directly).

base_config: configs/fb_vanilla_vae.yaml

# Overwrites mlflow.experiment_name from base_config for every run this
# sweep launches, so results land in their own experiment, separate from
# regular (non-sweep) vanilla_vae runs.
experiment_name: fb-vanilla-vae-sweep

grid:
  # training.lr: [0.001, 0.0001]
  # model.latent_dim: [16]
  model.lambda_bits: [ 0.5]
  # Architecture options -- both are FBVanillaVAE constructor args (see
  # fb_vanilla_vae.py): base_channels sets the conv channel width (schedule
  # is base_channels * [1, 2, 4, 4, ...]), n_conv_layers sets encoder/decoder
  # depth (each layer halves/doubles the sequence length).
  model.base_channels: [32, 64]
  model.n_conv_layers: [3, 7]
